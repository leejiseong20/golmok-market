spring:
  application:
    name: golmok-market

  # 기본값은 로컬 개발용이다. 운영(Docker)에서는 DB_URL·DB_USERNAME 을 환경변수로 덮어쓴다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/golmok?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # DDL은 SQL 스크립트로 직접 관리한다. 절대 create/update 쓰지 말 것.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # N+1 완화 (IN 절로 묶어서 조회)
    open-in-view: false                 # 영속성 컨텍스트를 컨트롤러까지 끌고 가지 않는다

server:
  port: 8080

jwt:
  # Base64 인코딩된 256비트 이상 키. 생성 예: openssl rand -base64 32
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 14d

cors:
  # localhost 와 127.0.0.1 을 모두 넣는다. 브라우저는 같은 출처라도 POST 에는 Origin 헤더를 붙이므로,
  # 프론트를 127.0.0.1:5173 으로 열면 localhost 만 허용된 설정에서는 로그인(POST)이 403 이 된다.
  # (GET 은 Origin 이 없어 통과해서, 목록은 되는데 로그인만 안 되는 형태로 나타난다.)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app:
  image:
    # 로컬 디스크. 배포 시 볼륨을 붙이거나 S3 로 옮겨야 한다.
    upload-dir: ${IMAGE_UPLOAD_DIR:./uploads}
    max-count: 10
    thumbnail-max-edge: ${IMAGE_THUMBNAIL_MAX_EDGE:640}
  scheduling:
    # 예약 작업(정리 배치)을 켤지. 끄면 정리 작업은 직접 실행할 때만 돈다.
    enabled: ${SCHEDULING_ENABLED:true}
  cleanup:
    # 매일 새벽 4시(한국 시간). 초 분 시 일 월 요일
    cron: "0 0 4 * * *"
    search-log-retention: 7d
    read-notification-retention: 30d
    unread-notification-retention: 90d
    batch-size: 1000

spring.servlet.multipart:
  max-file-size: 5MB
  # 10장 * 5MB + 여유. 요청 전체 한도를 두지 않으면 큰 요청 하나로 메모리를 밀어낼 수 있다.
  max-request-size: 55MB

---
# 로컬 개발 전용. ./gradlew bootRun 이 이 프로필을 켠다(build.gradle).
# SQL 바인딩 값(trace)에는 이메일·비밀번호 해시·토큰 해시가 그대로 찍히므로 운영에서는 절대 켜지 않는다.
# 기본값(프로필 없음)이 조용한 쪽이어야 설정을 빠뜨려도 운영 로그에 개인정보가 남지 않는다.
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
