spring:
  application:
    name: golmok-market

  datasource:
    url: jdbc:mysql://localhost:3306/golmok?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # DDL은 SQL 스크립트로 직접 관리한다. 절대 create/update 쓰지 말 것.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # N+1 완화 (IN 절로 묶어서 조회)
    open-in-view: false                 # 영속성 컨텍스트를 컨트롤러까지 끌고 가지 않는다

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

server:
  port: 8080

jwt:
  # Base64 인코딩된 256비트 이상 키. 생성 예: openssl rand -base64 32
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 14d

cors:
  # localhost 와 127.0.0.1 을 모두 넣는다. 브라우저는 같은 출처라도 POST 에는 Origin 헤더를 붙이므로,
  # 프론트를 127.0.0.1:5173 으로 열면 localhost 만 허용된 설정에서는 로그인(POST)이 403 이 된다.
  # (GET 은 Origin 이 없어 통과해서, 목록은 되는데 로그인만 안 되는 형태로 나타난다.)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
