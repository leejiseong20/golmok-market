# 테스트 전용 설정. 클래스패스에서 src/main/resources/application.yml 보다 먼저 잡혀
# 운영 설정을 통째로 대체한다. 로컬 MySQL 없이 H2 인메모리 DB로 컨텍스트를 띄운다.
spring:
  application:
    name: golmok-market

  datasource:
    url: jdbc:h2:mem:golmok;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 테스트는 엔티티 기준으로 스키마를 만들고 끝나면 지운다. 운영은 validate 유지.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

jwt:
  # 테스트 전용 더미 키. 운영 키가 아니다.
  secret: Z29sbW9rLW1hcmtldC10ZXN0LW9ubHktand0LXNlY3JldC1rZXkhIQ==
  access-token-validity: 30m
  refresh-token-validity: 14d

cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173

app:
  image:
    upload-dir: build/test-uploads
    max-count: 10
  scheduling:
    # 테스트 도중 정리 배치가 돌면 결과가 흔들린다. 정리 작업은 테스트가 직접 실행한다.
    enabled: false
  cleanup:
    cron: "0 0 4 * * *"
    search-log-retention: 7d
    read-notification-retention: 30d
    unread-notification-retention: 90d
    batch-size: 1000

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 55MB
