plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.golmok'
version = '0.0.1-SNAPSHOT'
description = 'golmok-market'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    // jjwt-jackson 은 Jackson 2 를 끌어온다. Boot 4 는 Jackson 3 이므로 메이저 버전 중복을 피해 gson 모듈을 쓴다.
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

/**
 * 로컬 실행용 비밀값 전달.
 *
 * bootRun 이 띄우는 JVM 은 Gradle 데몬의 환경을 물려받는다.
 * 그래서 셸에서 export 한 JWT_SECRET/DB_PASSWORD 가 앱까지 닿지 않고
 * "Illegal base64 character" 같은 엉뚱한 기동 실패로 나타난다.
 *
 * 값은 저장소 밖(~/.gradle/gradle.properties)의 Gradle 속성에 두고 여기서 넘긴다.
 *   jwtSecret=<openssl rand -base64 32 결과>
 *   dbPassword=<로컬 MySQL 비밀번호>
 * 속성이 없으면 환경변수를 쓰므로 배포 환경(환경변수 주입)은 그대로 동작한다.
 * 비밀값 자체는 절대 이 파일이나 application.yml 에 적지 않는다.
 */
tasks.named('bootRun') {
    [jwtSecret: 'JWT_SECRET', dbPassword: 'DB_PASSWORD'].each { propertyName, variableName ->
        def value = findProperty(propertyName) ?: System.getenv(variableName)
        if (value) {
            environment variableName, value
        }
    }
}
