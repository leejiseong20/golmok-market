plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.golmok'
version = '0.0.1-SNAPSHOT'
description = 'golmok-market'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    // jjwt-jackson 은 Jackson 2 를 끌어온다. Boot 4 는 Jackson 3 이므로 메이저 버전 중복을 피해 gson 모듈을 쓴다.
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// 시간대는 JVM 시작 시점에 고정한다(TimeConfig 설명 참고).
// 실행 환경의 기본 시간대(GitHub Actions 는 UTC)에 따라 테스트 결과가 달라지지 않게 한다.
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'Asia/Seoul'
}

/**
 * 로컬 실행용 비밀값 전달.
 *
 * bootRun 이 띄우는 JVM 은 Gradle 데몬의 환경을 물려받는다.
 * 그래서 셸에서 export 한 JWT_SECRET/DB_PASSWORD 가 앱까지 닿지 않고
 * "Illegal base64 character" 같은 엉뚱한 기동 실패로 나타난다.
 *
 * 값은 저장소 밖(~/.gradle/gradle.properties)의 Gradle 속성에 두고 여기서 넘긴다.
 *   jwtSecret=<openssl rand -base64 32 결과>
 *   dbPassword=<로컬 MySQL 비밀번호>
 * 속성이 없으면 환경변수를 쓰므로 배포 환경(환경변수 주입)은 그대로 동작한다.
 * 비밀값 자체는 절대 이 파일이나 application.yml 에 적지 않는다.
 */
tasks.named('bootRun') {
    // 로컬 개발에서만 SQL 로그를 켠다(application.yml 의 local 프로필). 운영 jar 는 프로필 없이 실행된다.
    environment 'SPRING_PROFILES_ACTIVE', 'local'
    jvmArgs '-Duser.timezone=Asia/Seoul'
    [jwtSecret: 'JWT_SECRET', dbPassword: 'DB_PASSWORD'].each { propertyName, variableName ->
        def value = findProperty(propertyName) ?: System.getenv(variableName)
        if (value) {
            environment variableName, value
        }
    }
}

// Dockerfile 이 버전과 무관하게 같은 이름으로 복사할 수 있게 고정한다.
// plain jar(의존성 없는 jar)는 배포에 쓰지 않으므로 만들지 않는다.
tasks.named('bootJar') {
    archiveFileName = 'golmok-market.jar'
}
tasks.named('jar') {
    enabled = false
}
