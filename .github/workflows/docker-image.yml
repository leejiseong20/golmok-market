# main 에 푸시하면 테스트를 돌리고, 통과하면 백엔드 이미지를 GitHub Container Registry 에 올린다.
# 배포 서버는 이 이미지를 내려받기만 한다(서버에서 빌드하지 않는다).
name: backend-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 테스트는 H2 로 돈다. DB·비밀값이 필요 없다.
      - name: 테스트
        run: chmod +x gradlew && ./gradlew test --no-daemon

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ARM 이미지의 마지막 단계(사용자 생성 등 짧은 명령)를 x86 러너에서 실행하기 위한 에뮬레이터.
      # Gradle 빌드는 Dockerfile 의 --platform=$BUILDPLATFORM 덕분에 에뮬레이션 없이 한 번만 돈다.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle Cloud 상시 무료: ARM(Ampere A1)이 주력, 자원 부족 시 x86(E2.1.Micro)로 대신한다.
      # 같은 태그에 두 종류를 담아 서버가 자기 CPU 에 맞는 것을 자동으로 내려받게 한다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
