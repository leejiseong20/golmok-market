# main 에 푸시하면 테스트를 돌리고, 통과하면 백엔드 이미지를 GitHub Container Registry 에 올린다.
# 배포 서버는 이 이미지를 내려받기만 한다(서버에서 빌드하지 않는다).
name: backend-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 테스트는 H2 로 돈다. DB·비밀값이 필요 없다.
      - name: 테스트
        run: chmod +x gradlew && ./gradlew test --no-daemon

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # EC2 t3.micro 는 x86_64 다. ARM 인스턴스(t4g)를 쓰려면 platforms 에 linux/arm64 를 추가해야 한다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
